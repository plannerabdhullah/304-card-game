<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>304 Card Game</title>
<style>
  html,body{margin:0;padding:0;background:#06251b;}
  :root{
    --felt-1:#0f3d2e;
    --felt-2:#0a2b21;
    --gold:#c9a24b;
    --gold-bright:#e6c874;
    --cream:#f3ecd9;
    --ink:#1c1a14;
    --maroon:#8c3b2e;
    --maroon-bright:#b04e3c;
    --line:rgba(201,162,75,0.35);
    --red-suit:#a8362a;
    --black-suit:#1c1a14;
  }
  *{box-sizing:border-box;}
  .rt-root{
    font-family:'Manrope',system-ui,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(ellipse at 50% 0%, rgba(230,200,116,0.06), transparent 60%),
      radial-gradient(ellipse at 50% 100%, var(--felt-2), var(--felt-1));
    min-height:600px;
    border-radius:14px;
    padding:0;
    position:relative;
    overflow:hidden;
    isolation:isolate;
  }
  .rt-root::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 14px);
    pointer-events:none;
  }
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&family=Manrope:wght@400;500;600;700;800&display=swap');
  .rt-display{font-family:'Fraunces',serif;}

  .rt-eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-bright);
    font-weight:700;
  }
  .rt-panel{
    max-width:480px;margin:40px auto;padding:28px 26px;
    background:rgba(10,30,23,0.55);
    border:1px solid var(--line);
    border-radius:16px;
    backdrop-filter:blur(2px);
  }
  .rt-title{font-size:34px;font-weight:700;margin:2px 0 6px;color:var(--cream);}
  .rt-sub{font-size:14px;color:rgba(243,236,217,0.7);line-height:1.5;margin-bottom:18px;}
  .rt-input{
    width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
    background:rgba(0,0,0,0.25);color:var(--cream);font-size:15px;font-family:inherit;
    margin-bottom:12px;outline:none;
  }
  .rt-input:focus{border-color:var(--gold);}
  .rt-input::placeholder{color:rgba(243,236,217,0.35);}
  .rt-btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:11px 18px;border-radius:9px;border:1px solid var(--gold);
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#221a08;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .rt-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(201,162,75,0.25);}
  .rt-btn:active{transform:translateY(0);}
  .rt-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .rt-btn-ghost{
    background:transparent;color:var(--cream);border:1px solid var(--line);font-weight:600;
  }
  .rt-btn-maroon{
    background:linear-gradient(180deg, var(--maroon-bright), var(--maroon));border-color:var(--maroon-bright);color:var(--cream);
  }
  .rt-row{display:flex;gap:10px;flex-wrap:wrap;}
  .rt-divider{height:1px;background:var(--line);margin:18px 0;}
  .rt-code{
    font-family:'Fraunces',serif;font-weight:700;letter-spacing:.18em;font-size:26px;
    color:var(--gold-bright);text-align:center;padding:10px;border:1px dashed var(--line);border-radius:10px;
  }
  .rt-seatgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
  .rt-seat-chip{
    padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,0.2);
    font-size:13px;text-align:center;cursor:pointer;
  }
  .rt-seat-chip.taken{opacity:.5;cursor:default;}
  .rt-seat-chip.taken.bot-taken{opacity:.75;cursor:pointer;}
  .rt-seat-chip.mine{border-color:var(--gold);background:rgba(201,162,75,0.15);}
  .rt-seat-chip .num{font-family:'Fraunces',serif;font-size:20px;color:var(--gold-bright);display:block;}

  /* ---- table layout ---- */
  .rt-table-wrap{padding:18px;min-height:640px;display:flex;flex-direction:column;}
  .rt-topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
  .rt-score-pill{
    display:flex;gap:14px;background:rgba(0,0,0,0.25);border:1px solid var(--line);
    border-radius:999px;padding:8px 16px;font-size:13px;align-items:center;
  }
  .rt-score-pill b{color:var(--gold-bright);font-family:'Fraunces',serif;font-size:16px;}

  .rt-oval{
    position:relative;flex:1;min-height:420px;
    background:
      radial-gradient(ellipse 60% 55% at 50% 50%, rgba(255,255,255,0.05), transparent 70%),
      var(--felt-1);
    border:8px solid #06251b;
    border-radius:220px/140px;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.45), 0 10px 30px rgba(0,0,0,0.35);
    margin:10px 0;
  }
  .rt-seatbox{
    position:absolute;width:150px;text-align:center;
  }
  .rt-seatbox.pos-bottom{bottom:6px;left:50%;transform:translateX(-50%);}
  .rt-seatbox.pos-top{top:6px;left:50%;transform:translateX(-50%);}
  .rt-seatbox.pos-left{left:2%;top:50%;transform:translateY(-50%);}
  .rt-seatbox.pos-right{right:2%;top:50%;transform:translateY(-50%);}
  .rt-seatname{
    font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;
    background:rgba(0,0,0,0.35);border:1px solid var(--line);display:inline-block;
  }
  .rt-seatname.turn{border-color:var(--gold-bright);box-shadow:0 0 0 3px rgba(201,162,75,0.18);color:var(--gold-bright);}
  .rt-seatname.teamA{border-left:3px solid #7fb69a;}
  .rt-seatname.teamB{border-left:3px solid #c98a6b;}
  .rt-cardcount{font-size:10px;opacity:.6;margin-top:3px;}

  .rt-trickzone{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:210px;height:150px;
  }
  .rt-trickcard{position:absolute;width:52px;height:74px;}
  .rt-trickcard.tc-bottom{left:50%;bottom:0;transform:translateX(-50%);}
  .rt-trickcard.tc-top{left:50%;top:0;transform:translateX(-50%);}
  .rt-trickcard.tc-left{left:0;top:50%;transform:translateY(-50%);}
  .rt-trickcard.tc-right{right:0;top:50%;transform:translateY(-50%);}

  .rt-card{
    width:52px;height:74px;border-radius:7px;background:var(--cream);
    border:1px solid rgba(0,0,0,0.25);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:16px;
    box-shadow:0 3px 8px rgba(0,0,0,0.35);
    user-select:none;
  }
  .rt-card .suit{font-size:18px;line-height:1;}
  .rt-card.red{color:var(--red-suit);}
  .rt-card.black{color:var(--black-suit);}
  .rt-card.back{
    background:
      repeating-linear-gradient(135deg, var(--maroon) 0 4px, var(--maroon-bright) 4px 8px);
    border:1px solid rgba(0,0,0,0.4);
  }

  .rt-myhand{
    display:flex;justify-content:center;gap:8px;padding:16px 6px 6px;flex-wrap:wrap;
  }
  .rt-myhand .rt-card{cursor:pointer;transition:transform .1s ease;}
  .rt-myhand .rt-card:hover{transform:translateY(-8px);}
  .rt-myhand .rt-card.disabled{opacity:.35;cursor:not-allowed;}
  .rt-myhand .rt-card.disabled:hover{transform:none;}

  .rt-actionbar{
    display:flex;justify-content:center;gap:10px;padding:10px 0 4px;flex-wrap:wrap;
  }
  .rt-banner{
    text-align:center;font-size:13px;color:rgba(243,236,217,0.8);padding:6px 0;
    min-height:20px;
  }
  .rt-banner b{color:var(--gold-bright);}

  .rt-modal-backdrop{
    position:absolute;inset:0;background:rgba(6,15,11,0.72);
    display:flex;align-items:center;justify-content:center;z-index:20;
    border-radius:14px;
  }
  .rt-modal{
    background:linear-gradient(180deg, #12362a, #0a2419);
    border:1px solid var(--line);border-radius:16px;padding:26px;max-width:420px;width:90%;
    text-align:center;
  }
  .rt-modal h3{font-family:'Fraunces',serif;font-size:24px;margin:0 0 10px;color:var(--gold-bright);}
  .rt-modal p{font-size:14px;line-height:1.6;color:rgba(243,236,217,0.85);margin:6px 0;}

  .rt-footnote{font-size:11px;color:rgba(243,236,217,0.4);text-align:center;padding:8px 0 2px;}

  .rt-credit{
    display:flex;align-items:center;justify-content:center;gap:7px;
    padding:8px 0 4px;cursor:pointer;opacity:.75;transition:opacity .15s ease;
  }
  .rt-credit:hover{opacity:1;}
  .rt-credit img{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--line);}
  .rt-credit span{font-size:11px;color:rgba(243,236,217,0.6);}
  .rt-about-photo{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin:0 auto 12px;display:block;}

  .rt-tricklog{
    max-width:520px;margin:6px auto 0;background:rgba(0,0,0,0.22);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;max-height:160px;overflow-y:auto;font-size:12px;
  }
  .rt-tricklog .row{
    display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed rgba(201,162,75,0.15);
    color:rgba(243,236,217,0.85);
  }
  .rt-tricklog .row:last-child{border-bottom:none;}
  .rt-tricklog .row.latest{color:var(--gold-bright);font-weight:700;}
  .rt-tricklog .empty{opacity:.5;text-align:center;padding:4px 0;}
  .rt-tricklog-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(243,236,217,0.5);margin-bottom:4px;}

  @media (max-width:520px){
    .rt-seatbox{width:110px;}
    .rt-card{width:42px;height:60px;font-size:13px;}
    .rt-trickcard{width:42px;height:60px;}
    .rt-oval{border-radius:120px/100px;min-height:380px;}
  }
</style>

</head>

  function parseCard(c){ return {suit:c[0], rank:c.slice(1)}; }
  function sortHandForDisplay(hand){
    return hand.slice().sort((a,b) => {
      const pa = parseCard(a), pb = parseCard(b);
      const suitDiff = SUITS.indexOf(pa.suit) - SUITS.indexOf(pb.suit);
      if (suitDiff !== 0) return suitDiff;
      return RANKS.indexOf(pa.rank) - RANKS.indexOf(pb.rank);
    });
  }
  function rankStrength(rank){ return RANKS.indexOf(rank); }
  function buildDeck(){
    const d = [];
    for (const s of SUITS) for (const r of RANKS) d.push(s+r);
    return d;
  }
  function shuffle(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function makeRoomCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  // ---------------- Storage Helpers ----------------
  const KEY = code => 'games/' + code;
  async function loadState(code){
    if (FIREBASE_NOT_CONFIGURED) return null;
    try{
      const snap = await db.ref(KEY(code)).get();
      return snap.exists() ? snap.val() : null;
    }catch(e){ return null; }
  }
  async function saveState(state){
    state.version = (state.version||0) + 1;
    if (FIREBASE_NOT_CONFIGURED){
      storageErrorMsg = "Firebase isn't configured yet.";
      return state;
    }
    let lastErr = null;
    for (let attempt = 0; attempt < 3; attempt++){
      try{
        await db.ref(KEY(state.roomCode)).set(state);
        storageErrorMsg = '';
        return state;
      }catch(e){
        lastErr = e;
        if (attempt < 2) await new Promise(r => setTimeout(r, 400 + attempt*400));
      }
    }
    console.error('Save failed after retries', lastErr);
    storageErrorMsg = "Connection hiccup — that move may not have saved.";
    return state;
  }

  // ---------------- App State ----------------
  let me = { name: '', seat: null, roomCode: null };
  let game = null;
  let pollTimer = null;
  let screen = 'landing';
  let errorMsg = '';
  let storageErrorMsg = '';
  let showAbout = false;
  let isBotProcessing = false;

  const root = document.getElementById('rt-app');

  function startPolling(){
    if (pollTimer){ pollTimer.ref.off('value', pollTimer.cb); pollTimer = null; }
    if (!me.roomCode || FIREBASE_NOT_CONFIGURED) return;
    const ref = db.ref(KEY(me.roomCode));
    const cb = (snap) => {
      const s = snap.val();
      if (s && (!game || s.version !== game.version)){
        game = s;
        render();
      }
    };
    ref.on('value', cb);
    pollTimer = { ref, cb };
  }

  // ---------------- Game State Mutations ----------------
  function freshState(roomCode){
    return {
      roomCode, version: 0, phase: 'lobby',

  function seatsForTeam(team){ return team === 'A' ? [1,3] : [2,4]; }
  function isBotSeat(seat, s){
    if (!s || !s.players) return false;
    const p = s.players.find(pl => pl.seat === seat);
    return !!(p && p.isBot);
  }

  async function createRoom(name){
    const code = makeRoomCode();
    let s = freshState(code);
    me = {name, seat:null, roomCode:code};
    game = await saveState(s);
    screen = 'lobby';
    startPolling();
    render();
  }

  async function joinRoom(code, name){
    code = code.trim().toUpperCase();
    const s = await loadState(code);
    if (!s){ errorMsg = "Couldn't find that room code."; render(); return; }
    me = {name, seat:null, roomCode:code};
    game = s;
    screen = 'lobby';
    startPolling();
    render();
  }

  async function pickSeatCore(s, seat){
    if (s.players.some(p=>p.seat===seat)) return;
    const idx = s.players.findIndex(p=> p.seat===me.seat && p.name===me.name && !p.isBot);
    if (idx>=0) s.players.splice(idx,1);
    s.players.push({seat, name: me.name, isBot:false});
    me.seat = seat;
    game = await saveState(s);
    render();
  }

  async function pickSeat(seat){
    const s = await loadState(me.roomCode);
    if (!s) return;
    await pickSeatCore(s, seat);
  }

  async function fillWithBots(){
    const s = await loadState(me.roomCode);
    if (!s) return;
    for (let seat=1; seat<=4; seat++){
      if (!s.players.some(p=>p.seat===seat)){
        s.players.push({seat, name:`Bot ${seat}`, isBot:true});
      }
    }
    game = await saveState(s);
    render();
  }

  async function removeBot(seat){
    const s = await loadState(me.roomCode);
    if (!s) return;
    const idx = s.players.findIndex(p=>p.seat===seat && p.isBot);
    if (idx<0) return;
    s.players.splice(idx,1);
    game = await saveState(s);
    render();
  }

  async function beginRound(){
    const s = await loadState(me.roomCode);
    if (!s) return;
    s.phase = 'awaiting_deal';
    game = await saveState(s);
    render();

  function coreDealFirst(s){
    const deck = shuffle(buildDeck());
    const hands = {1:[],2:[],3:[],4:[]};
    let idx = 0;
    for (let round=0; round<4; round++){
      for (let seat=1; seat<=4; seat++){
        hands[seat].push(deck[idx++]);
      }
    }
    s.hands = hands;
    s.deckRemainder = deck.slice(idx);
    s.trumpCallerSeat = null;
    s.trumpSuit = null;
    s.trumpRevealed = false;
    s.bid = null; s.biddingTeam = null; s.bidPasses = 0; s.bidLog = [];
    s.lastRaiserSeat = null;
    s.bidTurnSeat = nextSeat(s.dealerSeat);
    s.onestCalled = false;

    s.currentTrick = []; s.trickLeadSuit = null; s.trickNumber = 0;
    s.teamPointsX10 = {A:0,B:0}; s.tricksTaken = {A:0,B:0};
    s.lastRoundSummary = null;
    s.trickLog = [];
  }

  async function shuffleAndDealFirst(){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'awaiting_deal' || s.dealerSeat !== me.seat) return;
    coreDealFirst(s);
    game = await saveState(s);

  }

  async function bidOpen(){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'bidding' || s.bidTurnSeat !== me.seat || s.bid !== null) return;
    coreBidOpen(s, me.seat);
    await afterBidAction(s);
  }

  function coreChooseTrump(s, seat, card){
    const suit = parseCard(card).suit;
    s.trumpSuit = suit;
    s.trumpRevealed = false;
    if (s.trumpSelectViaOnest){
      s.trumpSelectViaOnest = false;
      startPlay(s);
    } else {
      s.phase = 'awaiting_deal2';
    }
  }

  async function chooseTrump(card){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'trump_select' || me.seat !== s.trumpCallerSeat) return;
    coreChooseTrump(s, me.seat, card);
    game = await saveState(s);
    render();
  }

  function coreBidRaise(s, seat){
    s.bid += 10;
    s.biddingTeam = TEAM_OF(seat);
    s.lastRaiserSeat = seat;
    s.bidPasses = 0;
    s.bidLog.push(`Seat ${seat} raises to ${s.bid}.`);
    s.bidTurnSeat = nextSeat(seat);
  }

  async function bidRaise(){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'bidding' || s.bidTurnSeat !== me.seat || s.bid === null) return;
    coreBidRaise(s, me.seat);
    await afterBidAction(s);
  }

  function coreBidPass(s, seat){
    s.bidPasses += 1;
    s.bidLog.push(`Seat ${seat} passes.`);
    if (s.bid === null){
      if (s.bidPasses >= 4){
        s.phase = 'awaiting_deal';
        s.bidLog.push('No bids — redeal.');
      } else {
        s.bidTurnSeat = nextSeat(seat);
      }
    } else {
      if (s.bidPasses >= 3){
        s.trumpCallerSeat = s.lastRaiserSeat;
        s.phase = 'trump_select';
        s.bidLog.push(`Bidding closed at ${s.bid}. Seat ${s.trumpCallerSeat} won bid.`);
      } else {
        s.bidTurnSeat = nextSeat(seat);
      }
    }
  }

  async function bidPass(){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'bidding' || s.bidTurnSeat !== me.seat) return;
    coreBidPass(s, me.seat);
    await afterBidAction(s);
  }

  async function afterBidAction(s){
    game = await saveState(s);
    render();
  }

  function coreDealSecond(s){
    const deck = s.deckRemainder;
    let idx = 0;
    for (let round=0; round<4; round++){
      for (let seat=1; seat<=4; seat++){
        s.hands[seat].push(deck[idx++]);
      }
    }
    s.deckRemainder = [];
    s.onestPassed = {1:false,2:false,3:false,4:false};
    s.phase = 'onest_window';
  }

  async function dealSecondFour(){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'awaiting_deal2' || me.seat !== s.trumpCallerSeat) return;
    coreDealSecond(s);
    game = await saveState(s);
    render();
  }

  function startPlay(s){
    s.phase = 'playing';
    s.turnSeat = s.trumpCallerSeat;
    s.trickNumber = 1;
    s.currentTrick = [];
    s.trickLeadSuit = null;
  }

  function coreOnestCall(s, seat){
    s.trumpCallerSeat = seat;
    s.trumpSuit = null;
    s.trumpRevealed = false;
    s.bid = 120;
    s.biddingTeam = TEAM_OF(seat);
    s.onestCalled = true;
    s.trumpSelectViaOnest = true;
    s.bidLog.push(`Seat ${seat} calls ONEST!`);
    s.phase = 'trump_select';
  }

  function coreOnestPass(s, seat){
    s.onestPassed = s.onestPassed || {1:false,2:false,3:false,4:false};
    s.onestPassed[seat] = true;
    if ([1,2,3,4].every(x => s.onestPassed[x])){
      startPlay(s);
    }
  }

  async function callOnest(){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'onest_window') return;
    coreOnestCall(s, me.seat);
    game = await saveState(s);
    render();
  }

  async function skipOnest(){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'onest_window') return;
    coreOnestPass(s, me.seat);
    game = await saveState(s);
    render();
  }

  // ---------------- Bot AI Logic ----------------
  function botHandStrengthX10(hand){
    return hand.reduce((sum,c)=> sum + POINTS10[parseCard(c).rank], 0);
  }

  function botDecideBid(seat, s){
    const strength = botHandStrengthX10(s.hands[seat]);
    const rand = Math.random();
    if (s.bid === null){
      return (strength >= 40 || rand < 0.15) ? 'open' : 'pass';
    }
    const willingness = strength - (s.bid - 60) * 1.5;
    return (willingness > 20 && rand < 0.6) ? 'raise' : 'pass';
  }

  function botChooseTrumpCard(seat, s){
    const hand = s.hands[seat];
    const bySuit = {};
    for (const c of hand){
      const suit = parseCard(c).suit;
      bySuit[suit] = (bySuit[suit]||0) + POINTS10[parseCard(c).rank] + 1;
    }
    let bestSuit = hand.length ? parseCard(hand[0]).suit : SUITS[0], bestVal = -1;
    for (const suit of SUITS){
      if ((bySuit[suit]||0) > bestVal){ bestVal = bySuit[suit]||0; bestSuit = suit; }
    }
    return hand.find(c => parseCard(c).suit === bestSuit) || hand[0];
  }

  function botDecideOnest(seat, s){
    const strength = botHandStrengthX10(s.hands[seat]);
    return strength >= 55 && Math.random() < 0.35;
  }

  function botLegalCards(seat, s){
    const hand = s.hands[seat];
    if (s.currentTrick.length === 0){
      if (seat === s.trumpCallerSeat && !s.trumpRevealed && s.trickNumber === 1){
        const nonTrump = hand.filter(c => parseCard(c).suit !== s.trumpSuit);
        return nonTrump.length ? nonTrump : hand.slice();
      }
      return hand.slice();
    }
    const following = hand.filter(c => parseCard(c).suit === s.trickLeadSuit);
    return following.length > 0 ? following : hand;
  }

  function lowestValue(seat, s) {
    return botLegalCards(seat, s).sort((a,b) => POINTS10[parseCard(a).rank] - POINTS10[parseCard(b).rank])[0];
  }

  // ---------------- Bot Execution Step ----------------
  async function stepBotsIfNeeded(){
    if (!game || screen !== 'table' || FIREBASE_NOT_CONFIGURED || isBotProcessing) return;
    const s = game;
    
    // Safety check: only host/first player evaluates bot turns to avoid multi-client race conditions
    const lowestHumanSeat = s.players.filter(p => !p.isBot).map(p => p.seat).sort()[0];
    if (me.seat !== lowestHumanSeat) return;

    let botActed = false;

    if (s.phase === 'awaiting_deal' && isBotSeat(s.dealerSeat, s)){
      coreDealFirst(s);
      botActed = true;
    } else if (s.phase === 'bidding' && isBotSeat(s.bidTurnSeat, s)){
      const act = botDecideBid(s.bidTurnSeat, s);
      if (act === 'open') coreBidOpen(s, s.bidTurnSeat);
      else if (act === 'raise') coreBidRaise(s, s.bidTurnSeat);
      else coreBidPass(s, s.bidTurnSeat);
      botActed = true;
    } else if (s.phase === 'trump_select' && isBotSeat(s.trumpCallerSeat, s)){
      const card = botChooseTrumpCard(s.trumpCallerSeat, s);
      coreChooseTrump(s, s.trumpCallerSeat, card);
      botActed = true;
    } else if (s.phase === 'awaiting_deal2' && isBotSeat(s.trumpCallerSeat, s)){
      coreDealSecond(s);
      botActed = true;
    } else if (s.phase === 'onest_window'){
      const unpassedBot = [1,2,3,4].find(st => isBotSeat(st, s) && !s.onestPassed[st]);
      if (unpassedBot){
        if (botDecideOnest(unpassedBot, s)) coreOnestCall(s, unpassedBot);
        else coreOnestPass(s, unpassedBot);
        botActed = true;
      }
    } else if (s.phase === 'playing' && isBotSeat(s.turnSeat, s)){
      const card = lowestValue(s.turnSeat, s);
      if (card) {
        await playCardCore(s, s.turnSeat, card);
        botActed = true;
      }
    }

    if (botActed) {
      isBotProcessing = true;
      setTimeout(async () => {
        await saveState(s);
        isBotProcessing = false;
        render();
      }, 600); // 600ms delay to give human players a smooth experience
    }
  }

  // ---------------- Gameplay Logic ----------------
  async function playCardCore(s, seat, card){
    const hand = s.hands[seat];
    const idx = hand.indexOf(card);
    if (idx >= 0) hand.splice(idx, 1);

    if (s.currentTrick.length === 0){
      s.trickLeadSuit = parseCard(card).suit;
    }

    s.currentTrick.push({ seat, card });

    if (s.currentTrick.length < 4){
      s.turnSeat = nextSeat(seat);
    } else {
      resolveTrick(s);
    }
  }

  function resolveTrick(s){
    let winningCard = s.currentTrick[0];
    let winningSuit = parseCard(winningCard.card).suit;

    for (let i = 1; i < 4; i++){
      const candidate = s.currentTrick[i];
      const cSuit = parseCard(candidate.card).suit;
      const cRank = parseCard(candidate.card).rank;
      const wRank = parseCard(winningCard.card).rank;

      if (s.trumpRevealed && cSuit === s.trumpSuit && winningSuit !== s.trumpSuit){
        winningCard = candidate;
        winningSuit = cSuit;
      } else if (cSuit === winningSuit && rankStrength(cRank) < rankStrength(wRank)){
        winningCard = candidate;
      }
    }

    const winnerSeat = winningCard.seat;
    const winnerTeam = TEAM_OF(winnerSeat);
    
    const trickPts = s.currentTrick.reduce((sum, item) => sum + POINTS10[parseCard(item.card).rank], 0);
    s.teamPointsX10[winnerTeam] += trickPts;
    s.tricksTaken[winnerTeam] += 1;

    s.trickLog.push({
      num: s.trickNumber,
      winner: winnerSeat,
      pts: trickPts,
      cards: s.currentTrick.map(t => `${t.seat}:${t.card}`).join(' ')
    });

    s.currentTrick = [];
    s.trickLeadSuit = null;

    if (s.trickNumber >= 8 || (s.hands[1].length === 0 && s.hands[2].length === 0)){
      evaluateRoundEnd(s);
    } else {
      s.trickNumber += 1;
      s.turnSeat = winnerSeat;
    }
  }

  function evaluateRoundEnd(s){
    s.phase = 'round_end';
    const bidTeam = s.biddingTeam;
    const defTeam = OTHER_TEAM(bidTeam);
    const targetPts = s.onestCalled ? 291.5 : (s.bid * 2.5);
    
    const bidTeamPoints = s.teamPointsX10[bidTeam];
    const madeBid = bidTeamPoints >= targetPts;
    const penalty = s.onestCalled ? 3 : (s.bid >= 100 ? 2 : 1);

    if (madeBid){
      s.stake[defTeam] = Math.max(0, s.stake[defTeam] - penalty);
    } else {
      s.stake[bidTeam] = Math.max(0, s.stake[bidTeam] - penalty);
    }

    s.lastRoundSummary = {
      biddingTeam: bidTeam,
      bid: s.bid,
      pointsScored: bidTeamPoints / 10,
      success: madeBid,
      penalty
    };

    if (s.stake.A <= 0 || s.stake.B <= 0){
      s.phase = 'game_over';
      s.winner = s.stake.A > 0 ? 'Team A' : 'Team B';
    } else {
      s.dealerSeat = nextSeat(s.dealerSeat);
    }
  }

  async function playCard(card){
    const s = await loadState(me.roomCode);
    if (!s || s.phase !== 'playing' || s.turnSeat !== me.seat) return;
    
    const hand = s.hands[me.seat];
    if (s.currentTrick.length > 0){
      const hasLeadSuit = hand.some(c => parseCard(c).suit === s.trickLeadSuit);
      if (hasLeadSuit && parseCard(card).suit !== s.trickLeadSuit){
        errorMsg = `You must follow lead suit (${SUIT_SYM[s.trickLeadSuit]}).`;
        render();
        return;
      }
    }
    
    if (s.currentTrick.length > 0 && !s.trumpRevealed){
      const hasLeadSuit = hand.some(c => parseCard(c).suit === s.trickLeadSuit);
      if (!hasLeadSuit && parseCard(card).suit !== s.trickLeadSuit){
        s.trumpRevealed = true;
      }
    }

    errorMsg = '';
    await playCardCore(s, me.seat, card);
    game = await saveState(s);
    render();
  }

  // ---------------- Rendering ----------------
  function renderCardHTML(cardStr, extraClass = ''){
    if (!cardStr) return `<div class="rt-card back ${extraClass}"></div>`;
    const {suit, rank} = parseCard(cardStr);
    const color = SUIT_COLOR[suit];
    return `
      <div class="rt-card ${color} ${extraClass}">
        <div>${rank}</div>
        <div class="suit">${SUIT_SYM[suit]}</div>
      </div>
    `;
  }

  function render(){
    stepBotsIfNeeded();

    if (screen === 'landing'){
      root.innerHTML = `
        <div class="rt-panel">
          <div class="rt-eyebrow">Sri Lankan Card Game</div>
          <div class="rt-title rt-display">304</div>
          <div class="rt-sub">Four players, two teams, one trump hidden face down. Create a room and share the code with your team, or join one already started.</div>
          ${errorMsg ? `<div style="color:var(--maroon-bright);font-size:13px;margin-bottom:10px;">${errorMsg}</div>` : ''}
          <input type="text" id="rt-name-in" class="rt-input" placeholder="Your name" value="${me.name||''}" />
          <div class="rt-row">
            <button class="rt-btn" id="rt-btn-create">Create room</button>
          </div>
          <div class="rt-divider"></div>
          <input type="text" id="rt-code-in" class="rt-input" placeholder="ROOM CODE (E.G. 7K3QN)" style="text-transform:uppercase;" />
          <div class="rt-row">
            <button class="rt-btn rt-btn-ghost" id="rt-btn-join" style="width:100%;">Join room</button>
          </div>
          <div class="rt-footnote">Each player opens this app on their device and joins with the room code. Realtime sync powered by Firebase.</div>
          <div class="rt-credit" id="rt-credit-link">
            <img src="${CREDIT_PHOTO}" alt="creator" />
            <span>Created by ${CREDIT_NAME}</span>
          </div>
        </div>
        ${renderAboutModal()}
      `;

      document.getElementById('rt-btn-create').onclick = () => {
        const name = document.getElementById('rt-name-in').value.trim() || 'Player';
        createRoom(name);
      };
      document.getElementById('rt-btn-join').onclick = () => {
        const name = document.getElementById('rt-name-in').value.trim() || 'Player';
        const code = document.getElementById('rt-code-in').value;
        if (!code){ errorMsg = 'Please enter a room code.'; render(); return; }
        joinRoom(code, name);
      };
      document.getElementById('rt-credit-link').onclick = () => { showAbout = true; render(); };
      bindAboutEvents();
      return;
    }

    if (screen === 'lobby'){
      const players = game ? game.players : [];

      root.innerHTML = `
        <div class="rt-panel">
          <div class="rt-eyebrow">Lobby</div>
          <div class="rt-code">${me.roomCode}</div>
          <div class="rt-sub" style="text-align:center;margin-top:6px;">Share code with your friends to join</div>
          
          <div class="rt-seatgrid">
            ${[1,2,3,4].map(seat => {
              const p = players.find(x => x.seat === seat);
              const isMine = me.seat === seat;
              const taken = !!p;
              return `
                <div class="rt-seat-chip ${taken?'taken':''} ${isMine?'mine':''} ${p&&p.isBot?'bot-taken':''}" data-seat="${seat}">
                  <span class="num">Seat ${seat} (Team ${TEAM_OF(seat)})</span>
                  <b>${p ? p.name : 'Empty'}</b>
                  ${p && p.isBot ? `<br/><span style="font-size:10px;color:var(--gold-bright);">(Click to remove bot)</span>` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <div class="rt-row" style="margin-top:14px;">
            <button class="rt-btn rt-btn-ghost" id="rt-btn-bot" style="flex:1;">Fill remaining with Bots</button>
            <button class="rt-btn" id="rt-btn-start" style="flex:1;" ${players.length < 4 ? 'disabled' : ''}>Start Game</button>
          </div>
          <div class="rt-footnote">Team A: Seats 1 & 3 | Team B: Seats 2 & 4</div>
        </div>
      `;

      document.querySelectorAll('.rt-seat-chip').forEach(el => {
        el.onclick = () => {
          const seat = parseInt(el.getAttribute('data-seat'));
          const p = players.find(x => x.seat === seat);
          if (p && p.isBot){ removeBot(seat); }
          else if (!p){ pickSeat(seat); }
        };
      });
      document.getElementById('rt-btn-bot').onclick = () => fillWithBots();
      document.getElementById('rt-btn-start').onclick = () => {
        screen = 'table';
        beginRound();
      };
      return;
    }

    if (screen === 'table'){
      const s = game;
      const myHand = (me.seat && s.hands[me.seat]) ? sortHandForDisplay(s.hands[me.seat]) : [];
      const isMyTurn = s.turnSeat === me.seat;

      root.innerHTML = `
        <div class="rt-table-wrap">
          <div class="rt-topbar">

              <span>Team A Stake: <b>${s.stake.A}</b></span>
              <span>Team B Stake: <b>${s.stake.B}</b></span>
            </div>

              <span>Current Bid: <b>${s.bid ? s.bid : 'None'}</b> ${s.biddingTeam ? `(Team ${s.biddingTeam})` : ''}</span>
              <span>Trump: <b>${s.trumpRevealed ? SUIT_SYM[s.trumpSuit] : (s.trumpSuit ? 'Hidden 🔒' : 'Unset')}</b></span>

          ${storageErrorMsg ? `<div style="background:var(--maroon);padding:6px;border-radius:6px;font-size:12px;text-align:center;">${storageErrorMsg}</div>` : ''}

          <div class="rt-oval">
            ${renderSeatBox(1, 'pos-bottom', s)}
            ${renderSeatBox(2, 'pos-right', s)}
            ${renderSeatBox(3, 'pos-top', s)}
            ${renderSeatBox(4, 'pos-left', s)}

            <div class="rt-trickzone">
              ${s.currentTrick.map(t => {
                const posClass = t.seat === 1 ? 'tc-bottom' : t.seat === 2 ? 'tc-right' : t.seat === 3 ? 'tc-top' : 'tc-left';
                return renderCardHTML(t.card, posClass);
              }).join('')}

          </div>

          <div class="rt-banner">${renderBannerStatus(s)}</div>
          <div class="rt-actionbar">${renderActionControls(s)}</div>

          <div class="rt-myhand">
            ${myHand.map(c => {
              const disabled = !isMyTurn || s.phase !== 'playing';
              return renderCardHTML(c, disabled ? 'disabled' : '');
            }).join('')}
          </div>

          <div class="rt-tricklog">
            <div class="rt-tricklog-title">Trick History</div>
            ${s.trickLog.length === 0 ? `<div class="empty">No tricks completed yet</div>` : ''}
            ${s.trickLog.slice().reverse().map((t, idx) => `
              <div class="row ${idx===0?'latest':''}">
                <span>Trick ${t.num}: Seat ${t.winner} won (+${t.pts/10} pts)</span>
              </div>

          </div>
        </div>

  function renderSeatBox(seat, posClass, s){
    const p = s.players.find(x => x.seat === seat);
    const isTurn = s.turnSeat === seat || s.bidTurnSeat === seat;
    const name = p ? p.name : `Seat ${seat}`;
    const cardCount = s.hands[seat] ? s.hands[seat].length : 0;
    const teamClass = `team${TEAM_OF(seat)}`;

    return `
      <div class="rt-seatbox ${posClass}">
        <div class="rt-seatname ${isTurn?'turn':''} ${teamClass}">${name} ${seat===me.seat?'(You)':''}</div>
        <div class="rt-cardcount">${cardCount} cards</div>
      </div>
    `;
  }

  function renderBannerStatus(s){
    if (s.phase === 'awaiting_deal') return `Dealer (Seat ${s.dealerSeat}) must shuffle and deal the first 4 cards.`;
    if (s.phase === 'bidding') return `Bidding Phase: Seat <b>${s.bidTurnSeat}</b>'s turn to bid or pass.`;
    if (s.phase === 'trump_select') return `Seat <b>${s.trumpCallerSeat}</b> won the bid! Choose a card from hand to set as hidden Trump.`;
    if (s.phase === 'awaiting_deal2') return `Trump set! Seat <b>${s.trumpCallerSeat}</b> needs to trigger second deal.`;
    if (s.phase === 'onest_window') return `Onest Window: Any player can call <b>ONEST</b> (120 bid) or skip.`;
    if (s.phase === 'playing') return `Trick ${s.trickNumber}/8: Seat <b>${s.turnSeat}</b>'s turn to play.`;
    if (s.phase === 'round_end') return `Round Completed!`;
    return '';
  }

  function renderActionControls(s){
    if (s.phase === 'awaiting_deal' && s.dealerSeat === me.seat){
      return `<button class="rt-btn" id="rt-act-deal1">Deal First 4 Cards</button>`;
    }
    if (s.phase === 'bidding' && s.bidTurnSeat === me.seat){
      const canOpen = s.bid === null;
      return `
        ${canOpen ? `<button class="rt-btn" id="rt-act-open">Open Bid (60)</button>` : `<button class="rt-btn" id="rt-act-raise">Raise Bid (+10)</button>`}
        <button class="rt-btn rt-btn-ghost" id="rt-act-pass">Pass</button>
      `;
    }
    if (s.phase === 'awaiting_deal2' && s.trumpCallerSeat === me.seat){
      return `<button class="rt-btn" id="rt-act-deal2">Deal Second 4 Cards</button>`;
    }
    if (s.phase === 'onest_window' && me.seat && s.onestPassed && !s.onestPassed[me.seat]){
      return `
        <button class="rt-btn rt-btn-maroon" id="rt-act-onest">Call ONEST</button>
        <button class="rt-btn rt-btn-ghost" id="rt-act-skiponest">Skip</button>
      `;
    }
    return '';
  }

  function renderModals(s){
    let modalHTML = '';
    if (s.phase === 'trump_select' && s.trumpCallerSeat === me.seat){
      const hand = s.hands[me.seat] || [];
      modalHTML += `
        <div class="rt-modal-backdrop">
          <div class="rt-modal">
            <h3>Select Hidden Trump</h3>
            <p>Pick one card from your hand to set as hidden trump.</p>
            <div style="display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap;">
              ${hand.map(c => `<div class="rt-card-pick" data-card="${c}">${renderCardHTML(c)}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    if (s.phase === 'round_end'){
      const sum = s.lastRoundSummary;
      modalHTML += `
        <div class="rt-modal-backdrop">
          <div class="rt-modal">
            <h3>Round Finished!</h3>
            <p>Team <b>${sum.biddingTeam}</b> bid <b>${sum.bid}</b> and scored <b>${sum.pointsScored}</b> points.</p>
            <p style="color:${sum.success?'var(--gold-bright)':'var(--maroon-bright)'};font-size:18px;font-weight:700;">
              ${sum.success ? 'Bid Successful!' : 'Bid Failed!'}
            </p>
            <button class="rt-btn" id="rt-act-nextround">Start Next Round</button>
          </div>
        </div>
      `;
    }

    if (s.phase === 'game_over'){
      modalHTML += `
        <div class="rt-modal-backdrop">
          <div class="rt-modal">
            <h3>Game Over!</h3>
            <p style="font-size:20px;color:var(--gold-bright);">🏆 ${s.winner} Wins! 🏆</p>
            <button class="rt-btn" id="rt-act-restart">Return to Lobby</button>
          </div>
        </div>
      `;
    }

    return modalHTML + renderAboutModal();
  }

  function renderAboutModal(){
    if (!showAbout) return '';
    return `
      <div class="rt-modal-backdrop">
        <div class="rt-modal">
          <img src="${CREDIT_PHOTO}" class="rt-about-photo" alt="Creator" />
          <h3>About the Game</h3>
          <p>Created by <b>${CREDIT_NAME}</b></p>
          <p style="font-size:12px;opacity:0.8;">Contact: ${CREDIT_EMAIL}</p>
          <p style="font-size:13px;margin-top:10px;">304 is a classic trick-taking game popular in Sri Lanka and South Asia. Enjoy playing with friends!</p>
          <button class="rt-btn rt-btn-ghost" id="rt-close-about" style="margin-top:12px;">Close</button>
        </div>
      </div>
    `;
  }

  function bindAboutEvents(){
    const btn = document.getElementById('rt-close-about');
    if (btn) btn.onclick = () => { showAbout = false; render(); };
  }

  function bindTableEvents(s){
    bindAboutEvents();

    const btnDeal1 = document.getElementById('rt-act-deal1');
    if (btnDeal1) btnDeal1.onclick = () => shuffleAndDealFirst();

    const btnOpen = document.getElementById('rt-act-open');
    if (btnOpen) btnOpen.onclick = () => bidOpen();

    const btnRaise = document.getElementById('rt-act-raise');
    if (btnRaise) btnRaise.onclick = () => bidRaise();

    const btnPass = document.getElementById('rt-act-pass');
    if (btnPass) btnPass.onclick = () => bidPass();

    const btnDeal2 = document.getElementById('rt-act-deal2');
    if (btnDeal2) btnDeal2.onclick = () => dealSecondFour();

    const btnOnest = document.getElementById('rt-act-onest');
    if (btnOnest) btnOnest.onclick = () => callOnest();

    const btnSkipOnest = document.getElementById('rt-act-skiponest');
    if (btnSkipOnest) btnSkipOnest.onclick = () => skipOnest();

    const btnNextRound = document.getElementById('rt-act-nextround');
    if (btnNextRound) btnNextRound.onclick = async () => {
      s.phase = 'awaiting_deal';
      await saveState(s);
      render();
    };

    const btnRestart = document.getElementById('rt-act-restart');
    if (btnRestart) btnRestart.onclick = () => {
      screen = 'lobby';
      render();
    };

    document.querySelectorAll('.rt-card-pick').forEach(el => {
      el.onclick = () => {
        const card = el.getAttribute('data-card');
        chooseTrump(card);
      };
    });

    document.querySelectorAll('.rt-myhand .rt-card').forEach((el, idx) => {
      el.onclick = () => {
        const myHand = sortHandForDisplay(s.hands[me.seat] || []);
        if (myHand[idx]){
          playCard(myHand[idx]);
        }
      };
    });
  }

  render();
})();
</script>
</body>
</html>
